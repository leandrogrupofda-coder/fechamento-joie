:root{--vd:#0F362F;--vd2:#17493D;--lim:#C6E03C;--tx:#14231F;--mt:#5C7A70}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden;
 font-family:Calibri,Carlito,"Segoe UI",sans-serif;font-variant-numeric:lining-nums;color:var(--tx);
 background:
  radial-gradient(90% 70% at 76% 14%,rgba(255,255,255,.42) 0%,rgba(255,255,255,0) 58%),
  radial-gradient(120% 100% at 10% 92%,#2F5C45 0%,rgba(47,92,69,0) 64%),
  radial-gradient(90% 80% at 50% 118%,rgba(10,34,27,.55) 0%,rgba(10,34,27,0) 70%),
  linear-gradient(152deg,#D6E7B8 0%,#A9C98D 38%,#6E9570 72%,#3F6B52 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(72px);z-index:0;pointer-events:none;
 animation:fl 20s ease-in-out infinite alternate}
.b1{width:54vw;height:54vw;left:-14vw;top:-6vh;background:#C6E03C;opacity:.42}
.b2{width:44vw;height:44vw;right:-12vw;bottom:-18vh;background:#13402F;opacity:.5;animation-duration:27s}
.b3{width:26vw;height:26vw;right:18vw;top:-10vh;background:#FFFFFF;opacity:.3;animation-duration:33s}
@keyframes fl{to{transform:translate3d(3vw,-4vh,0) scale(1.09)}}
@media(prefers-reduced-motion:reduce){.blob{animation:none}}
.arco{position:absolute;z-index:1;left:50%;top:54%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
 width:min(760px,128vw);height:min(760px,128vw);border:1.5px solid rgba(255,255,255,.55)}
.arco2{width:min(540px,94vw);height:min(540px,94vw);border-color:rgba(15,54,47,.2)}
.topo{position:relative;z-index:3;height:64px;flex:0 0 64px;background:var(--vd);display:flex;align-items:center;
 justify-content:space-between;padding:0 clamp(16px,4vw,34px)}
.topo img{height:25px;display:block}
.topo span{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--lim);font-weight:700}
.mid{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;padding:26px 16px}
.box{width:min(404px,94vw);background:rgba(255,255,255,.93);border-radius:20px;border-top:4px solid var(--lim);
 padding:30px 32px 28px;box-shadow:0 34px 90px rgba(8,28,22,.42),0 1px 0 rgba(255,255,255,.8) inset}
.box h1{margin:0;font-size:22px;font-weight:700;color:var(--vd);text-align:center;letter-spacing:.01em}
.box .sub{text-align:center;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--mt);margin:6px 0 0}
.risco{width:46px;height:3px;background:var(--lim);border-radius:2px;margin:15px auto 0}
label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--mt);margin:17px 0 6px}
input{width:100%;font:inherit;font-size:15.5px;padding:12px 13px;border:1.5px solid #D5E0D9;border-radius:10px;
 background:#F7FAF8;color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus{border-color:var(--vd);background:#fff;box-shadow:0 0 0 4px rgba(198,224,60,.38)}
button{width:100%;margin-top:22px;font:inherit;font-weight:700;font-size:15.5px;background:var(--vd);color:#fff;
 border:0;border-radius:10px;padding:13px;cursor:pointer;letter-spacing:.05em;transition:background .15s,transform .08s}
button:hover{background:var(--vd2)}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:wait}
.err{color:#A3261B;font-size:13.5px;margin-top:11px;min-height:18px;text-align:center;font-weight:700}
.nt{font-size:11px;color:#86A295;margin-top:15px;line-height:1.45;text-align:center}
.rod{position:relative;z-index:3;text-align:center;padding:0 16px 18px;font-size:10.5px;letter-spacing:.3em;
 text-transform:uppercase;color:rgba(255,255,255,.88);text-shadow:0 1px 12px rgba(0,0,0,.3)}
@media(max-width:620px){.arco,.arco2{display:none}.topo span{display:none}}
</style></head><body>
